services:
  ios-bridge:
    build: .
    container_name: ios_bridge
    restart: always
    network_mode: "host"
    environment:
      - YTDLP_CACHE_DIR=/app/.cache/yt-dlp
      - IOS_BRIDGE_API_KEY=${IOS_BRIDGE_API_KEY:-}
      - PORT=8002
      # Dedicated MariaDB credentials for the StashOpusPlayer iOS app
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USER=stash
      - DB_PASSWORD=player
      - DB_NAME=discord_music_gws
      # JWT secret for account tokens
      - IOS_JWT_SECRET=${IOS_JWT_SECRET:-stash-opus-player-jwt-secret-2026}
      # Optional: set SERVER_MUSIC_DIR to a path inside the container to enable
      # the server music library feature. Mount your music directory as a volume.
      # Example: SERVER_MUSIC_DIR=/music  (then add: - /your/music:/music:ro)
      - SERVER_MUSIC_DIR=${SERVER_MUSIC_DIR:-}
      # Optional: per-user music storage. Each user gets their own subdirectory.
      # If unset, falls back to {SERVER_MUSIC_DIR}/users/ when SERVER_MUSIC_DIR is set.
      # Example: USER_MUSIC_DIR=/usermusic  (then add: - /your/usermusic:/usermusic)
      - USER_MUSIC_DIR=${USER_MUSIC_DIR:-}
    volumes:
      - ./cache/yt-dlp:/app/.cache/yt-dlp
      # Add your music directory mount here if using SERVER_MUSIC_DIR, e.g.:
      # - /path/to/your/music:/music:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
