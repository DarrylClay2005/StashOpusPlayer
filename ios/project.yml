name: StashOpusPlayer
options:
  bundleIdPrefix: com.stash
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StashOpusPlayer:
    type: application
    platform: iOS
    sources:
      - path: StashOpusPlayer/Sources
    resources:
      - path: StashOpusPlayer/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stash.opusplayer.ios
        INFOPLIST_FILE: StashOpusPlayer/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: StashOpusPlayer/Resources/StashOpusPlayer.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
