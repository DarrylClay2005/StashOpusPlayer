name: StashOpusPlayer

options:
  bundleIdPrefix: com.stash
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_SWIFT_FLAGS: "-D DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: "YES"

targets:
  StashOpusPlayer:
    type: application
    platform: iOS
    sources:
      - path: StashOpusPlayer/Sources
    resources:
      - path: StashOpusPlayer/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stash.opusplayer.ios
        INFOPLIST_FILE: StashOpusPlayer/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: StashOpusPlayer/Resources/StashOpusPlayer.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      buildAction:
        targets:
          - StashOpusPlayer
      runAction:
        config: Debug
      testAction:
        config: Debug
      profileAction:
        config: Release
      archiveAction:
        config: Release
      analyzeAction:
        config: Debug
      testTargets:
        - StashOpusPlayerTests

  StashOpusPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StashOpusPlayer/Tests
    dependencies:
      - target: StashOpusPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stash.opusplayer.ios.tests
        INFOPLIST_FILE: ""
