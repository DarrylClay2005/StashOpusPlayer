plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.kapt'
}

// Enable Google Play publishing plugin
apply plugin: 'com.github.triplet.play'

android {
    namespace 'com.stash.opusplayer'
    compileSdk 34

    // Load API keys from local.properties or environment variables
    def localPropertiesFile = rootProject.file("local.properties")
    def localProperties = new Properties()
    def youtubeApiKey = ""
    
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
        youtubeApiKey = localProperties.getProperty('YOUTUBE_API_KEY', '')
    }
    
    // Fallback to environment variable if not in local.properties
    if (youtubeApiKey == null || youtubeApiKey.isEmpty()) {
        youtubeApiKey = System.getenv('YOUTUBE_API_KEY') ?: ''
    }

    defaultConfig {
        applicationId "com.stash.opusplayer"
        minSdk 21
        targetSdk 34
        versionCode 142
        versionName "12.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Inject YouTube API key into BuildConfig
        buildConfigField "String", "YOUTUBE_API_KEY", "\"${youtubeApiKey}\""
    }

    // Load release keystore from local.properties if available
    def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE', '')
    def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD', '')
    def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS', '')
    def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD', '')

    def hasReleaseKeystore = (releaseStoreFile != null && releaseStoreFile.length() > 0 && file(releaseStoreFile).exists() &&
            releaseStorePassword != null && releaseStorePassword.length() > 0 &&
            releaseKeyAlias != null && releaseKeyAlias.length() > 0 &&
            releaseKeyPassword != null && releaseKeyPassword.length() > 0)

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }
    
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        
        release {
            // Enable code optimization and obfuscation
            minifyEnabled true
            shrinkResources true
            debuggable false
            zipAlignEnabled true
            
            // Enable R8 full mode for better optimization
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Fallback: sign release with debug keystore to avoid invalid package installs
                signingConfig signingConfigs.debug
            }
        }
        
        // Beta build variant for testing
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            debuggable false
            minifyEnabled true
            shrinkResources true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        incremental true
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
            '-Xjsr305=strict',
            '-Xopt-in=kotlin.RequiresOptIn'
        ]
    }
    
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
        // Disable lint checks that are not critical for performance
        disable 'UnusedResources', 'IconMissingDensityFolder'
    }
    
    // Performance optimizations for build
    dexOptions {
        javaMaxHeapSize "4g"
        preDexLibraries = true
    }
    
    
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}


// Configure Gradle Play Publisher. Credentials path is provided via env var GPP_SERVICE_ACCOUNT_JSON.
play {
    // Use AAB by default for publishing
    defaultToAppBundles.set(true)
    // Target the production track for release
    track.set("production")
    // Optional: infer credentials from env var; if absent, publishing will prompt/fail gracefully
    def creds = System.getenv("GPP_SERVICE_ACCOUNT_JSON")
    if (creds != null && creds.length() > 0) {
        serviceAccountCredentials.set(file(creds))
    }
}

dependencies {
    // Glide transformations for blurred backdrops, etc.
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    // MP3 tag editing (used for embedding artwork into MP3 files)
    implementation 'com.mpatric:mp3agic:0.9.1'
    // Generic audio tag editing for MP4/M4A/FLAC/OGG/OPUS/WMA where supported
    implementation 'org.jaudiotagger:jaudiotagger:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'
    
    // Media playback
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'
    implementation 'androidx.media3:media3-common:1.2.0'
    implementation 'androidx.media3:media3-session:1.2.0'
    
    // Media library for notifications
    implementation 'androidx.media:media:1.7.0'
    
    // Permissions
    implementation 'com.karumi:dexter:6.2.3'
    
    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Networking for update checker
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Networking for online artwork
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    
    // YouTube Data API and video downloading
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20220719-2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.0.0'
    implementation 'com.google.http-client:google-http-client-gson:1.42.3'
    
    // Video downloading (yt-dlp alternative for Android)
    implementation 'com.github.yausername:youtubedl-android:0.13.0'
    
    // YouTube Player for direct streaming
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0'
    
    // Additional HTTP client for downloads
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    
    // JSON parsing
    implementation 'org.json:json:20230618'
    
    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // SAF DocumentFile for folder scanning via content URIs
    implementation 'androidx.documentfile:documentfile:1.0.1'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Swipe to refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // WorkManager for background rescans
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    
    // CardView (used in mini player layout)
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // Room database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // AWS SDK for DynamoDB
    implementation 'com.amazonaws:aws-android-sdk-core:2.77.0'
    implementation 'com.amazonaws:aws-android-sdk-ddb:2.77.0'
    implementation 'com.amazonaws:aws-android-sdk-ddb-mapper:2.77.0'
    implementation 'com.amazonaws:aws-android-sdk-auth-core:2.77.0'
    implementation 'com.amazonaws:aws-android-sdk-auth-userpools:2.77.0'
    
    // AWS SDK additional dependencies
    implementation 'com.amazonaws:aws-android-sdk-cognitoidentityprovider:2.77.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
