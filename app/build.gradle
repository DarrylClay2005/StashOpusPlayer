plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

// Enable Google Play publishing plugin
apply plugin: 'com.github.triplet.play'

android {
    namespace 'com.stash.opusplayer'
    compileSdk 34

    // Load API keys from local.properties or environment variables
    def localPropertiesFile = rootProject.file("local.properties")
    def localProperties = new Properties()
    def youtubeApiKey = ""
    
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
        youtubeApiKey = localProperties.getProperty('YOUTUBE_API_KEY', '')
    }
    
    // Fallback to environment variable if not in local.properties
    if (youtubeApiKey == null || youtubeApiKey.isEmpty()) {
        youtubeApiKey = System.getenv('YOUTUBE_API_KEY') ?: ''
    }

    defaultConfig {
        applicationId "com.stash.opusplayer"
        minSdk 21
        targetSdk 34
        versionCode 146
        versionName "13.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Limit native ABIs to reduce size (TFLite native libs)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // Inject YouTube API key into BuildConfig (empty by default, overridden in debug)
        buildConfigField "String", "YOUTUBE_API_KEY", "\"\""
    }

    // API level flavors to allow a minSdk 24 debug build without changing global minSdk
    flavorDimensions "api"
    productFlavors {
        min21 {
            dimension "api"
            minSdk 21
        }
        min24 {
            dimension "api"
            minSdk 24
        }
    }

    // Load release keystore from local.properties if available
    def releaseStoreFile = localProperties.getProperty('RELEASE_STORE_FILE', '')
    def releaseStorePassword = localProperties.getProperty('RELEASE_STORE_PASSWORD', '')
    def releaseKeyAlias = localProperties.getProperty('RELEASE_KEY_ALIAS', '')
    def releaseKeyPassword = localProperties.getProperty('RELEASE_KEY_PASSWORD', '')

    def hasReleaseKeystore = (releaseStoreFile != null && releaseStoreFile.length() > 0 && file(releaseStoreFile).exists() &&
            releaseStorePassword != null && releaseStorePassword.length() > 0 &&
            releaseKeyAlias != null && releaseKeyAlias.length() > 0 &&
            releaseKeyPassword != null && releaseKeyPassword.length() > 0)

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }
    
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            // Provide API key only in debug builds
            buildConfigField "String", "YOUTUBE_API_KEY", "\"${youtubeApiKey}\""
        }
        
        release {
            // Enable code optimization and obfuscation
            minifyEnabled true
            shrinkResources true
            debuggable false
            zipAlignEnabled true
            
            // Enable R8 full mode for better optimization
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Fallback: sign release with debug keystore to avoid invalid package installs
                signingConfig signingConfigs.debug
            }
            // Ensure no API key is embedded in release
            buildConfigField "String", "YOUTUBE_API_KEY", "\"\""
        }
        
        // Beta build variant for testing
        beta {
            initWith release
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            debuggable false
            minifyEnabled true
            shrinkResources true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xjsr305=strict',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }
    
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
        // Re-enable checks for better feedback during development
        // (kept non-fatal)
    }
    
    
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }

        // Room KSP arguments (schema export & incremental)
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
    }
    // Disable min21 debug in legacy variantFilter (kept for compatibility)
}

// AGP 8+ preferred variant API to disable min21 debug at configuration time
androidComponents {
    beforeVariants(selector().all()) { builder ->
        def isDebug = builder.buildType == "debug"
        def hasMin21 = builder.productFlavors.any { it.second == "min21" }
        if (isDebug && hasMin21) {
            builder.enable = false
        }
    }
}


// Configure Gradle Play Publisher. Credentials path is provided via env var GPP_SERVICE_ACCOUNT_JSON.
play {
    // Use AAB by default for publishing
    defaultToAppBundles.set(true)
    // Target the production track for release
    track.set("production")
    // Optional: infer credentials from env var; if absent, publishing will prompt/fail gracefully
    def creds = System.getenv("GPP_SERVICE_ACCOUNT_JSON")
    if (creds != null && creds.length() > 0) {
        serviceAccountCredentials.set(file(creds))
    }
}

dependencies {
    // BOMs
    implementation platform('com.squareup.okhttp3:okhttp-bom:4.11.0')
    implementation platform('com.squareup.retrofit2:retrofit-bom:2.11.0')
    // AWS Amplify (requires minSdk 24) — restrict to min24 flavor
    min24Implementation 'com.amplifyframework:core:2.18.0'
    min24Implementation 'com.amplifyframework:aws-auth-cognito:2.18.0'
    min24Implementation 'com.amplifyframework:aws-storage-s3:2.18.0'
    min24Implementation 'com.amplifyframework:aws-api:2.18.0'

    // Glide transformations for blurred backdrops, etc.
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    // MP3 tag editing (used for embedding artwork into MP3 files)
    implementation 'com.mpatric:mp3agic:0.9.1'
    // Generic audio tag editing for MP4/M4A/FLAC/OGG/OPUS/WMA where supported
    implementation 'org.jaudiotagger:jaudiotagger:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'
    
    // Media playback
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    
    // Media library for notifications
    implementation 'androidx.media:media:1.7.0'
    
    // Permissions
    implementation 'com.karumi:dexter:6.2.3'
    
    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Networking for update checker (managed by BOMs)
    implementation 'com.squareup.retrofit2:retrofit'
    implementation 'com.squareup.retrofit2:converter-gson'
    implementation 'com.squareup.okhttp3:logging-interceptor'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Networking for online artwork (managed by BOM)
    implementation 'com.squareup.okhttp3:okhttp'
    
    // YouTube Data API and video downloading
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20220719-2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.0.0'
    implementation 'com.google.http-client:google-http-client-gson:1.42.3'
    
    // Video downloading (yt-dlp alternative for Android)
    implementation 'com.github.yausername:youtubedl-android:0.13.0'
    
    // YouTube Player for direct streaming
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:12.1.0'
    
    // JSON parsing
    implementation 'org.json:json:20230618'
    
    // Preferences
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // SAF DocumentFile for folder scanning via content URIs
    implementation 'androidx.documentfile:documentfile:1.0.1'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Swipe to refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // WorkManager for background rescans
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    
    // Timber logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
    
    // CardView (used in mini player layout)
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    
    // Room database (migrated to KSP)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    
    // Lifecycle components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Coroutines for lifecycleScope/Dispatchers/withContext
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // TensorFlow Lite for AI audio analysis
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
