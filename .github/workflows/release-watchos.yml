name: Release watchOS IPA

# Produces an unsigned watchOS .ipa of the standalone companion target.
# NOTE: a watch app normally installs embedded in its iOS host; this standalone
# artifact is primarily for archival/distribution in the watch port repo.

on:
  push:
    tags:
      - 'watch/v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish watchOS release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#watch/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stamp version into project.yml
        run: |
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"/" ios/project.yml

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Lumisound.xcodeproj \
            -scheme LumisoundWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -archivePath build/LumisoundWatch.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO 2>&1 | tee /tmp/watchbuild.log | tail -25
          if grep -q "error:" /tmp/watchbuild.log; then
            echo "--- Compiler errors ---"; grep "error:" /tmp/watchbuild.log | head -30
          fi
          APP=$(find build/LumisoundWatch.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Archive did not produce a .app bundle"; exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA (unsigned)
        id: ipa
        working-directory: ios
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_NAME="LumisoundWatch-${VERSION}-unsigned.ipa"
          mkdir -p build/Payload/Payload
          cp -R "$APP_PATH" build/Payload/Payload/
          (cd build/Payload && zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store")
          echo "IPA: $(du -sh build/$IPA_NAME)"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IPA_NAME="${{ steps.ipa.outputs.ipa_name }}"
          gh release create "$TAG" \
            --title "Lumisound watchOS v${VERSION}" \
            --notes "$(printf 'Apple Watch companion build for Lumisound v%s.\n\nThis is the standalone artifact; the watch app normally installs embedded in the iOS app once a signing path that supports embedded watch apps is used.' "$VERSION")" \
            "ios/build/$IPA_NAME"
