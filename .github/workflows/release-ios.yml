name: Release iOS IPA

on:
  push:
    tags:
      - 'ios/v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & publish iOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#ios/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing Lumisound iOS version: $VERSION (tag: $TAG)"

      - name: Stamp version into project.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" ios/project.yml
          grep MARKETING_VERSION ios/project.yml

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          echo "Selected Xcode: $XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Lumisound.xcodeproj \
            -scheme Lumisound \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Lumisound.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -20
          APP=$(find build/Lumisound.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Archive did not produce a .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA (unsigned)
        id: ipa
        working-directory: ios
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_NAME="Lumisound-${VERSION}-unsigned.ipa"
          PAYLOAD_DIR="build/Payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/Payload
          zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store"
          echo "IPA created: $(du -sh ../$IPA_NAME)"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=ios/build/$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Update altstore-source.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DOWNLOAD_URL="https://github.com/HeavenlyXenusVR/Lumisound/releases/download/ios%2Fv${VERSION}/Lumisound-${VERSION}-unsigned.ipa"

          python3 - <<EOF
          import json, sys

          with open("ios/altstore-source.json", "r") as f:
              source = json.load(f)

          app = source["apps"][0]

          new_version = {
              "version": "$VERSION",
              "date": "$VERSION_DATE",
              "downloadURL": "$DOWNLOAD_URL",
              "localizedDescription": "See release notes on GitHub.",
              "size": 400000,
              "minOSVersion": "16.0"
          }

          existing = [v for v in app.get("versions", []) if v.get("version") != "$VERSION"]
          app["versions"] = [new_version] + existing

          with open("ios/altstore-source.json", "w") as f:
              json.dump(source, f, indent=2)
              f.write("\n")

          print("Updated altstore-source.json to version $VERSION")
          EOF

      - name: Commit updated altstore-source.json
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ios/altstore-source.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore(ios): update altstore-source.json to v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "Lumisound iOS v${VERSION}" \
            --notes "$(printf '## Lumisound iOS v%s\n\n**Installation:** Download the IPA and install with [Sideloadly](https://sideloadly.io/) or [AltStore](https://altstore.io/).\n\n**AltStore users:** Add the source URL from Settings → Streaming to get automatic updates.' "$VERSION")" \
            "ios/build/Lumisound-${VERSION}-unsigned.ipa"
