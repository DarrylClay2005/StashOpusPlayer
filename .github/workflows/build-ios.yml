name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options: [ Release, Debug ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest available stable Xcode
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build configuration
        id: config
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          echo "configuration=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -project StashOpusPlayer.xcodeproj \
            -scheme StashOpusPlayer \
            -configuration ${{ steps.config.outputs.configuration }} \
            -destination "generic/platform=iOS" \
            -archivePath build/StashOpusPlayer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30 || { echo "xcodebuild failed"; exit 1; }
          # Verify the .app was produced
          APP=$(find build/StashOpusPlayer.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Archive did not produce a .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package IPA (unsigned)
        working-directory: ios
        run: |
          MARKETING_VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          IPA_NAME="StashOpusPlayer-v${MARKETING_VERSION}-unsigned.ipa"
          PAYLOAD_DIR="build/Payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/Payload
          zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store"
          echo "IPA created: $(du -sh ../$IPA_NAME)"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StashOpusPlayer-unsigned-ipa
          path: ios/build/${{ env.IPA_NAME }}
          retention-days: 14

      - name: Upload archive (for re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: StashOpusPlayer-xcarchive
          path: ios/build/StashOpusPlayer.xcarchive
          retention-days: 7
