name: Release tvOS IPA

# Produces an unsigned tvOS .ipa (install on Apple TV with atvloadly).
# Independent of the iOS release pipeline.

on:
  push:
    tags:
      - 'tvos/v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish tvOS release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#tvos/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stamp version into project.yml
        run: |
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"/" ios/project.yml

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # See release-ios.yml's identical step for why this is required —
      # TVBridgeClient.officialBridgeAPIKey reads the same build-time-injected
      # key and without it every check_auth-gated bridge route 401s.
      - name: Write bridge API key config
        env:
          LUMISOUND_BRIDGE_API_KEY: ${{ secrets.LUMISOUND_BRIDGE_API_KEY }}
        run: |
          mkdir -p ios/Config
          echo "LUMISOUND_BRIDGE_API_KEY = ${LUMISOUND_BRIDGE_API_KEY}" > ios/Config/Secrets.xcconfig
          if [ -z "$LUMISOUND_BRIDGE_API_KEY" ]; then
            echo "::warning::LUMISOUND_BRIDGE_API_KEY secret is not set — this build will ship with no bridge API key and every check_auth-gated route (search/stream/etc.) will fail against the official bridge."
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Lumisound.xcodeproj \
            -scheme LumisoundTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/LumisoundTV.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO 2>&1 | tee /tmp/tvbuild.log | tail -25
          if grep -q "error:" /tmp/tvbuild.log; then
            echo "--- Compiler errors ---"; grep "error:" /tmp/tvbuild.log | head -30
          fi
          APP=$(find build/LumisoundTV.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Archive did not produce a .app bundle"; exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # Unsigned archives don't run actool for the app icon, so compile the
      # tvOS Brand Assets (App Icon + Top Shelf) into the .app manually — without
      # this the app shows the blank placeholder icon on the Home screen.
      - name: Compile Brand Assets (actool)
        working-directory: ios
        run: |
          XCASSETS="LumisoundTV/Resources/Assets.xcassets"
          xcrun actool \
            --output-format human-readable-text \
            --notices --warnings \
            --platform appletvos \
            --minimum-deployment-target 16.0 \
            --target-device tv \
            --app-icon "App Icon & Top Shelf Image" \
            --output-partial-info-plist /tmp/tvassets.plist \
            --compress-pngs \
            --compile "$APP_PATH" \
            "$XCASSETS"
          echo "Assets.car: $(du -sh "$APP_PATH/Assets.car" 2>/dev/null || echo MISSING)"

          # actool compiling Assets.car alone isn't enough — tvOS finds the app
          # icon via CFBundleIcons/CFBundlePrimaryIcon keys that --output-
          # partial-info-plist writes to a SEPARATE file, not the app's own
          # Info.plist. Without merging that in, the icon data sits in
          # Assets.car but nothing in the bundle points at it, so the Home
          # Screen falls back to the blank placeholder — exactly what shipped
          # in tvos/v1.4.19 and tvos/v1.4.20 despite Assets.car compiling
          # "successfully" both times. PlistBuddy's Merge command folds the
          # partial plist's keys into the real Info.plist in place.
          /usr/libexec/PlistBuddy -c "Merge /tmp/tvassets.plist" "$APP_PATH/Info.plist"
          echo "--- /tmp/tvassets.plist (keys merged in) ---"
          cat /tmp/tvassets.plist
          echo "--- Info.plist icon keys after merge (diagnostic only) ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_PATH/Info.plist" || echo "(no CFBundleIcons key — check the partial plist dump above for the actual key name)"

      - name: Package IPA (unsigned)
        id: ipa
        working-directory: ios
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_NAME="LumisoundTV-${VERSION}-unsigned.ipa"
          mkdir -p build/Payload/Payload
          cp -R "$APP_PATH" build/Payload/Payload/
          (cd build/Payload && zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store")
          echo "IPA: $(du -sh build/$IPA_NAME)"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IPA_NAME="${{ steps.ipa.outputs.ipa_name }}"
          gh release create "$TAG" \
            --title "Lumisound tvOS v${VERSION}" \
            --notes "$(printf 'Apple TV build for Lumisound v%s.\n\n**Install:** download the .ipa and sideload it to your Apple TV with **atvloadly**. Search and stream from the Lumisound bridge.' "$VERSION")" \
            "ios/build/$IPA_NAME"
