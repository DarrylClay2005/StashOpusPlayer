name: Build and Attach Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK and AAB
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Generate checksums
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk > RELEASE_CHECKSUMS.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab >> RELEASE_CHECKSUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            RELEASE_CHECKSUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
